plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
}

// Every subproject (versions/<mc>) builds the same mod for one Minecraft version.
// Shared sources come from the root /src folder; each version adds its own
// small /versions/<mc>/src layer for the classes that touch changed vanilla APIs.
subprojects {
	def remapped = project.property('remap').toBoolean()
	def javaVersion = project.property('java_version') as int

	// 1.21.x is obfuscated and needs remapping, 26.x ships with Mojang names.
	apply plugin: remapped ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'

	group = rootProject.maven_group
	version = "${rootProject.mod_version}+mc${project.mc_label}"

	base {
		archivesName = rootProject.archives_name
	}

	repositories {
		mavenCentral()
		maven { url = "https://maven.fabricmc.net/" }
		maven { url = "https://maven.terraformersmc.com/releases/" }
	}

	loom {
		splitEnvironmentSourceSets()

		mods {
			"stunslam" {
				sourceSet sourceSets.main
				sourceSet sourceSets.client
			}
		}
	}

	sourceSets {
		main {
			java.srcDirs = [rootProject.file('src/main/java')]
			resources.srcDirs = [rootProject.file('src/main/resources')]
		}
		client {
			java.srcDirs = [rootProject.file('src/client/java'), 'src/client/java']
			resources.srcDirs = [rootProject.file('src/client/resources')]
		}
	}

	// Mod dependencies must be remapped on 1.21.x and are used as-is on 26.x.
	def mod = remapped ? 'modImplementation' : 'implementation'

	dependencies {
		minecraft "com.mojang:minecraft:${project.minecraft_version}"

		if (remapped) {
			mappings loom.officialMojangMappings()
		}

		add(mod, "net.fabricmc:fabric-loader:${rootProject.loader_version}")
		add(mod, "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}")

		// Optional at runtime, present in the dev environment.
		add(mod, "com.terraformersmc:modmenu:${project.modmenu_version}")
	}

	def expandProps = [
			version             : project.version,
			minecraft_dependency: project.minecraft_dependency,
			java_version        : javaVersion
	]

	tasks.named('processResources') {
		inputs.properties expandProps
		filesMatching("fabric.mod.json") {
			expand expandProps
		}
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = javaVersion
		it.options.encoding = 'UTF-8'
	}

	java {
		withSourcesJar()

		sourceCompatibility = JavaVersion.toVersion(javaVersion)
		targetCompatibility = JavaVersion.toVersion(javaVersion)
	}

	tasks.named('jar') {
		from(rootProject.file("LICENSE")) {
			rename { "${it}_${rootProject.archives_name}" }
		}
	}

	// Collect the finished jar of every version in /build/libs.
	def collectJar = tasks.register('collectJar', Copy) {
		from(tasks.named(remapped ? 'remapJar' : 'jar'))
		into(rootProject.layout.buildDirectory.dir('libs'))
	}

	tasks.named('build') {
		finalizedBy(collectJar)
	}
}
